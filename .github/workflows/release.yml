name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      # The release key lives in GitHub encrypted secrets, never in the repo.
      # Tagged releases must be signed with it; manual test runs may fall
      # back to the debug key.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Release tags must be signed. Add the ANDROID_KEYSTORE_* secrets."
              exit 1
            fi
            echo "::warning::No signing secrets: this APK uses the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          umask 077
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" \
            > android/key.properties
      - run: flutter build apk --release --split-per-abi
      # Show apksigner's full output and fail on its own exit code (pipefail),
      # rather than grepping for a line whose wording varies across build-tools.
      - name: Verify signature
        shell: bash
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
            if [[ "$GITHUB_REF" == refs/tags/* ]] && grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
          done
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
      # Stable names (no version) so links like
      # releases/latest/download/snag-android-arm64-v8a.apk always work.
      - name: Rename
        run: |
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp build/app/outputs/flutter-apk/app-$abi-release.apk dist/snag-android-$abi.apk
          done
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/* }

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev imagemagick
      - run: flutter build linux --release
      - run: |
          mkdir dist
          tar -C build/linux/x64/release/bundle -czf dist/snag-linux-x64.tar.gz .
      - name: Packaging tools
        run: |
          curl -fsSLo "$RUNNER_TEMP/nfpm.deb" https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
          sudo curl -fsSLo /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      # .deb, .rpm and AppImage; runners have no FUSE, so appimagetool unpacks itself.
      - run: linux/packaging/build.sh
        env: { APPIMAGE_EXTRACT_AND_RUN: "1" }
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build windows --release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/snag-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build macos --release
      - run: |
          mkdir dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/Snag.app dist/snag-macos.zip
      # Drag-to-install DMG: the app next to a shortcut to /Applications.
      # Unsigned (ad-hoc), like the zip; hdiutil on hosted runners sometimes
      # fails with "Resource busy", so give it a few tries.
      - name: DMG
        run: |
          mkdir dmg
          ditto build/macos/Build/Products/Release/Snag.app dmg/Snag.app
          ln -s /Applications dmg/Applications
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname Snag -srcfolder dmg -format UDZO -ov dist/snag-macos.dmg && break
            sleep 10
          done
          hdiutil verify dist/snag-macos.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/* }

  # Fails in seconds if the tag doesn't match pubspec.yaml or CHANGELOG.md
  # has no section for it, instead of after every platform has built.
  notes:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tool/release_notes.py --check "$GITHUB_REF_NAME"

  publish:
    needs: [notes, android, linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      # CHANGELOG section, download table, help and checksums (also written
      # to dist/SHA256SUMS.txt). GitHub appends the merged PRs below it.
      - name: Release notes
        id: notes
        run: |
          python3 tool/release_notes.py "$GITHUB_REF_NAME" dist > "$RUNNER_TEMP/notes.md"
          echo "title=Snag ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*
          generate_release_notes: true
          draft: true
